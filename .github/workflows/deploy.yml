name: Deploy Voxeil
on:
  push:
    branches: [ main ]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile Sunucuya Bağlan
        uses: appleboy/ssh-action@master
        with:
          host: 91.132.49.198
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /home/voxeilyazilim/web/voxeil.com/public_html
            git fetch origin
            git reset --hard origin/main
            npm install --omit=dev
            npm run build
            pm2 delete voxeil-app || true
            pm2 start npm --name "voxeil-app" --max-memory-restart 250M -- start -- -p 3000
            pm2 save
