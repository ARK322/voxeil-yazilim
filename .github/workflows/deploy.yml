name: Deploy Next.js App

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile Sunucuya Bağlan ve Güncelle
        uses: appleboy/ssh-action@master
        with:
          host: 91.132.49.198
          username: voxeilyazilim
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            # 1. Proje klasörüne git
            cd /home/voxeilyazilim/web/voxeil.com/public_html
            
            # 2. GitHub'daki son değişiklikleri çek
            git fetch origin
            git reset --hard origin/main
            
            # 3. Bağımlılıkları yükle (Sadece üretim paketleri)
            npm install --omit=dev
            
            # 4. Next.js projesini derle
            npm run build
            
            # 5. Ensure .env.local exists with PORT
            cat > .env.local << EOF
            PORT=3000
            NEXT_PUBLIC_PORT=3000
            EOF
            
            # 6. PM2 ile uygulamayı temiz bir şekilde başlat
            # (package.json already has -H 127.0.0.1 for localhost binding)
            pm2 delete voxeil-app || true
            pm2 start npm --name "voxeil-app" -- start --update-env --env PORT=3000 --cwd /home/voxeilyazilim/web/voxeil.com/public_html
            
            # 7. Sunucu yeniden başlarsa uygulamanın otomatik açılması için kaydet
            pm2 save
