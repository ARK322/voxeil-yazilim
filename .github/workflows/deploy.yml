name: Deploy Next.js App
on:
  push:
    branches: [ main ] # Sadece main branch'ine kod pushladığında çalışır

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH ile Sunucuya Bağlan ve Güncelle
        uses: appleboy/ssh-action@master
        with:
          host: 91.132.49.198
          username: ${{ secrets.HESTIA_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            # 1. Proje klasörüne git (HestiaCP standart yolu)
            cd /home/${{ secrets.HESTIA_USER }}/web/masorburak.com/public_html
            
            # 2. GitHub'daki son değişiklikleri çek (Token ayarını yaptığımız için şifre sormaz)
            git pull origin main
            
            # 3. Bağımlılıkları yükle (Sadece üretim paketleri)
            npm install --omit=dev
            
            # 4. Next.js projesini derle (Build al - Hata aldığın server.js sorununu bu çözer)
            npm run build
            
            # 5. PM2 ile uygulamayı temiz bir şekilde başlat
            # Varsa eski süreci siler, yoksa hata vermeden devam eder
            pm2 delete masor-app || true
            
            # Next.js'i npm üzerinden "start" komutuyla başlatır
            pm2 start npm --name "masor-app" -- start
            
            # 6. Sunucu yeniden başlarsa uygulamanın otomatik açılması için kaydet
            pm2 save
