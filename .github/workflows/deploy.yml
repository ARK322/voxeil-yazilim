name: Deploy Next.js App
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: 91.132.49.198
          username: voxeil
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            cd /home/voxeil/web/voxeil.com/public_html
            git pull origin main
            npm install --omit=dev
            npm run build
            pm2 delete voxeil-app || true
            pm2 start npm --name "voxeil-app" -- start
            pm2 save
